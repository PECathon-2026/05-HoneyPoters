<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Authentication Portal — PrivacyLens Scenario #2</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .card { max-width: 460px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #a855f7; font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.75rem; background: #7e22ce; color: white; padding: 2px 8px; border-radius: 4px; font-weight: normal; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.35rem; font-weight: 500; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 0.6rem 0.8rem; border-radius: 6px; font-family: monospace; font-size: 0.9rem; }
    input:focus { outline: none; border-color: #a855f7; }
    .btn { background: #a855f7; color: white; border: none; padding: 0.75rem 1.25rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 1rem; }
    .btn:hover { background: #9333ea; }
    .security-note { font-size: 0.75rem; color: #64748b; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>
      🔐 Corporate Identity Gateway
      <span class="badge">Scenario #2</span>
    </h2>
    <p style="font-size: 0.85rem; color: #94a3b8;">Simulates single sign-on authentication with password and 6-digit OTP token.</p>

    <form id="authForm" onsubmit="event.preventDefault();">
      <div class="field">
        <label for="loginEmail">Enterprise Email Identifier</label>
        <input type="email" id="loginEmail" name="email" value="admin.security@honeycorp.io" autocomplete="email" />
      </div>

      <div class="field">
        <label for="loginPassword">Master Vault Password</label>
        <input type="password" id="loginPassword" name="password" value="AlphaOmega#2026!" autocomplete="current-password" />
      </div>

      <div class="field">
        <label for="loginOtp">Two-Factor 6-Digit OTP Code</label>
        <input type="text" id="loginOtp" name="otp" value="749201" maxlength="6" autocomplete="one-time-code" />
      </div>

      <button type="submit" class="btn">Authenticate Session</button>
    </form>

    <div class="security-note">
      🛡️ PrivacyLens Protected: Intercepts raw passwords and 2FA tokens before autonomous browser agent crawlers read them.
    </div>
  </div>
</body>
</html>
