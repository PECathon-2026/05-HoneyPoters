<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock E-Commerce Checkout — PrivacyLens Scenario #1</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .card { max-width: 540px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.75rem; background: #0284c7; color: white; padding: 2px 8px; border-radius: 4px; font-weight: normal; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.35rem; font-weight: 500; }
    input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 0.6rem 0.8rem; border-radius: 6px; font-family: monospace; font-size: 0.9rem; }
    input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    .row { display: flex; gap: 1rem; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 0.75rem 1.25rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 1rem; }
    .btn:hover { background: #0ea5e9; }
    .security-note { font-size: 0.75rem; color: #64748b; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>
      🛒 E-Commerce Express Checkout
      <span class="badge">Scenario #1</span>
    </h2>
    <p style="font-size: 0.85rem; color: #94a3b8;">Simulates high-risk credit card payment & residential shipping address submission.</p>

    <form id="checkoutForm" onsubmit="event.preventDefault();">
      <div class="field">
        <label for="fullName">Recipient Full Name</label>
        <input type="text" id="fullName" name="name" value="Aditi Singhal" autocomplete="name" />
      </div>

      <div class="field">
        <label for="shippingAddress">Shipping & Delivery Address</label>
        <textarea id="shippingAddress" name="shipping_address" data-field="address" rows="2">Flat 402, Royal Palms, MG Road, Bengaluru, Karnataka 560001</textarea>
      </div>

      <div class="field">
        <label for="email">Contact Email</label>
        <input type="email" id="email" name="email" value="aditi.singhal@pec-alumni.org" autocomplete="email" />
      </div>

      <div class="field">
        <label for="cardNumber">Payment Card Number (Visa)</label>
        <input type="text" id="cardNumber" name="card_number" autocomplete="cc-number" value="4242 4242 4242 4242" />
      </div>

      <div class="row">
        <div class="field" style="flex: 2;">
          <label for="cardExpiry">Expiration Date</label>
          <input type="text" id="cardExpiry" name="cc_exp" autocomplete="cc-exp" value="12/28" />
        </div>
        <div class="field" style="flex: 1;">
          <label for="cardCvv">CVV</label>
          <input type="password" id="cardCvv" name="cvv" autocomplete="cc-csc" value="894" />
        </div>
      </div>

      <button type="submit" class="btn">Confirm & Place Order (Rs 14,999)</button>
    </form>

    <div class="security-note">
      🛡️ PrivacyLens Protected: Outbound form DOM state is sanitized client-side before any AI agent dispatches.
    </div>
  </div>
</body>
</html>
