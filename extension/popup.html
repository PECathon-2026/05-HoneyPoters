<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyLens Shield</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: #0369a1;
      border-radius: 4px;
      color: #e0f2fe;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0ea5e9;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .status-pill {
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon16.png" width="16" height="16" alt="Shield Logo" style="vertical-align: middle;">
      <span>PrivacyLens</span>
    </div>
    <span class="badge">MV3 Active</span>
  </div>

  <div class="toggle-row">
    <div>
      <div style="font-size: 12px; font-weight: 600;">Privacy Shield</div>
      <div style="font-size: 10px; color: #94a3b8;" id="shield-mode-desc">Intercepting Outbound AI</div>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="shield-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="stat-intercepted">0</div>
      <div class="stat-label">Intercepted</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-threats" style="color: #f87171;">0</div>
      <div class="stat-label">Threats Blocked</div>
    </div>
  </div>

  <div class="status-pill" id="status-pill">
    🟢 Shield Active: Zero Cloud Leakage
  </div>

  <script src="popup.js"></script>
</body>
</html>
